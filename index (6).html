<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWD PRM – terminal ZRM (symulator)</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#fff}
body{padding:12px;overflow-x:auto}
.dev{position:relative;width:100%;max-width:1000px;min-width:640px;margin:0 auto}
.dev>img{display:block;width:100%;height:auto}
.scr{position:absolute;left:12.1%;top:19.1%;width:75.3%;height:62.7%;background:#000;overflow:hidden;border-radius:4px}
.ui{position:absolute;left:0;top:0;width:1000px;height:651px;transform-origin:0 0;background:#f3f6fa;color:#12263f;font:16px/1.35 system-ui,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
.ui input,.ui textarea,.ui select{user-select:text;-webkit-user-select:text}
#pg{position:absolute;inset:0}
.top{height:72px;background:#0b2a55;color:#fff;display:flex;align-items:center;gap:14px;padding:0 18px}
.top .lg{width:46px;height:46px}
.top h1{margin:0;font-size:21px;letter-spacing:.05em;flex:1}
.top .r{text-align:right;line-height:1.15}
.clk{font-size:26px;font-weight:700}
.dt{font-size:13px;opacity:.85}
.team{background:#1976d2;border-radius:6px;padding:8px 12px;font-weight:700;font-size:17px}
.hd{height:64px;background:#0b2a55;color:#fff;display:flex;align-items:center;gap:12px;padding:0 14px}
.hd h2{margin:0;font-size:20px;flex:1;letter-spacing:.03em}
.hd .clk{font-size:22px}
.hb{background:#1976d2;color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.bd{position:absolute;top:64px;left:0;right:0;bottom:0;padding:14px;overflow:auto}
.bd.mn{top:72px}
.grid{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:122px;gap:12px}
.tile{background:#1565c0;color:#fff;border:0;border-radius:12px;display:flex;align-items:center;gap:18px;padding:0 22px;cursor:pointer;text-align:left;font:inherit;box-shadow:0 3px 0 #0d47a1}
.tile:active{background:#0d47a1;transform:translateY(2px);box-shadow:none}
.tile .i{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.tile .i svg{width:38px;height:38px}
.tile b{display:block;font-size:22px;letter-spacing:.03em}
.tile small{font-size:14px;opacity:.9}
.btn{background:#1565c0;color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn:active{background:#0d47a1}
.btn.sec{background:#e1e8f1;color:#0b2a55}
.btn.red{background:#c62828}
.btn.next{outline:3px solid #ffb300}
.btn.done{background:#2e7d32}
.btn.cur{background:#0b2a55;outline:3px solid #ffb300}
.bar{display:flex;gap:10px;margin-bottom:12px;align-items:center}
.it{background:#fff;border:1px solid #d5dde8;border-left:7px solid #1565c0;border-radius:8px;padding:10px 14px;margin-bottom:10px;cursor:pointer}
.it.p1{border-left-color:#c62828}.it.p2{border-left-color:#ef8f00}.it.p3{border-left-color:#2e7d32}
.it .g1{display:flex;justify-content:space-between;font-size:17px}
.it .g2{color:#40566f;margin:2px 0 4px}
.it .g3{display:flex;gap:14px;font-size:14px;color:#40566f}
.pr{font-weight:700}.st{margin-left:auto;font-weight:700;color:#0d47a1}
.two{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
.card{background:#fff;border:1px solid #d5dde8;border-radius:10px;padding:12px 16px}
.kv{display:grid;grid-template-columns:170px 1fr;gap:6px 10px;padding:5px 0;border-bottom:1px solid #eef2f7}
.kv span{color:#5b6f86}
.btns{display:flex;flex-direction:column;gap:10px}
.cur2{font-size:34px;font-weight:700;color:#0b2a55;margin:6px 0}
.fm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.f{display:block;font-size:13px;color:#4a607a}
.f.s2{grid-column:span 2}.f.s4{grid-column:span 4}
.f input,.f textarea,.f select,#mi,#msel,#msd{display:block;width:100%;margin-top:3px;padding:9px;border:1px solid #9fb0c4;border-radius:6px;font:inherit;font-size:16px;background:#fff;color:#12263f}
.f textarea{resize:none}
.em{color:#5b6f86;padding:20px;text-align:center}
.cm{display:flex;flex-direction:column;gap:8px}
.chat{flex:1;overflow:auto;background:#fff;border:1px solid #d5dde8;border-radius:10px;padding:10px}
.bub{max-width:70%;padding:8px 12px;border-radius:12px;margin-bottom:8px;background:#e1e8f1}
.bub.me{margin-left:auto;background:#1565c0;color:#fff}
.bub small{display:block;opacity:.75;font-size:12px}
.qk{display:flex;gap:8px;flex-wrap:wrap}.qk .btn{padding:8px 12px;font-size:14px}
.snd{display:flex;gap:8px}.snd input{margin:0}
.mp{display:flex;flex-direction:column;gap:8px}
.mw{flex:1;border:1px solid #9fb0c4;border-radius:10px;overflow:hidden;position:relative;background:#e9eef1;min-height:0}
.mw .z{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mw .z .btn{padding:6px 14px;font-size:20px}
#msvg{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#lock{position:absolute;inset:0;z-index:20;background:linear-gradient(165deg,#0b2a55 0%,#1565c0 100%);color:#fff;text-align:center;touch-action:none;cursor:grab;transition:transform .35s ease}
#lock.drag{transition:none}
#lock .tm{font-size:130px;font-weight:300;margin-top:120px;line-height:1}
#lock .ld{font-size:26px;margin-top:10px}
#lock .lt{position:absolute;top:22px;left:0;right:0;display:flex;justify-content:center;gap:12px;align-items:center;font-weight:700;letter-spacing:.06em}
#lock .lt svg{width:34px;height:34px}
#lock .hn{position:absolute;bottom:26px;left:0;right:0;font-size:20px}
#lock .hn i{display:block;width:90px;height:6px;border-radius:3px;background:#fff;margin:0 auto 12px}
#toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#0b2a55;color:#fff;padding:12px 22px;border-radius:30px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;font-weight:600}
#toast.on{opacity:1}
</style>
</head>

const STEPS=[['Przyjmij zlecenie','Przyjęte',null],['W drodze','W drodze','W drodze'],['Na miejscu','Na miejscu','Na miejscu zdarzenia'],['Transport pacjenta','Transport pacjenta','Transport pacjenta'],['W szpitalu','W szpitalu','W szpitalu'],['Zakończ zlecenie','Zakończone','Dostępny']];

function setStatus(s){S.status=s;S.since=Date.now();S.slog.unshift({s,t:hm(new Date())})}
let stack=[['menu']];
const nav=(v,a)=>{stack.push([v,a]);render()};
const back=()=>{if(stack.length>1)stack.pop();render()};
const kv=a=>a.map(([k,v])=>'<div class="kv"><span>'+k+'</span><div>'+esc(v||'—')+'</div></div>').join('');
const head=t=>'<div class="hd"><button class="hb" data-act="back">‹ Wróć</button><h2>'+t+'</h2><span class="clk"></span><button class="hb" data-act="menu">⌂ Menu</button></div>';
const fld=(l,n,type,val,c)=>'<label class="f '+(c||'')+'">'+l+'<input name="'+n+'" type="'+(type||'text')+'" value="'+esc(val)+'"></label>';
const area=(l,n,val,c)=>'<label class="f '+(c||'')+'">'+l+'<textarea name="'+n+'" rows="2">'+esc(val)+'</textarea></label>';
const sel=(l,n,o,val,c)=>'<label class="f '+(c||'')+'">'+l+'<select name="'+n+'">'+o.map(x=>'<option'+(x===val?' selected':'')+'>'+x+'</option>').join('')+'</select></label>';
const fd=()=>{const o={};ui.querySelectorAll('[name]').forEach(e=>o[e.name]=e.value);return o};
const callRow=(c,v)=>'<div class="it p'+c.pr+'" data-act="go" data-v="'+v+'" data-a="'+esc(c.id)+'"><div class="g1"><b>'+esc(c.id)+'</b><span>'+esc(c.type)+'</span></div><div class="g2">'+esc(c.addr)+'</div><div class="g3"><span>Zgłoszenie: '+c.t+'</span><span class="pr">Priorytet P'+c.pr+'</span><span class="st">'+esc(c.st)+'</span></div></div>';
const TLN={accept:'Przyjęto zlecenie',road:'W drodze',scene:'Na miejscu',transport:'Transport pacjenta',hosp:'W szpitalu',end:'Zakończono'};
const callKv=c=>kv([['Numer zdarzenia',c.id],['Adres zdarzenia',c.addr],['Rodzaj zdarzenia',c.type],['Godzina zgłoszenia',c.t],['Priorytet','P'+c.pr+(c.pr===1?' – pilny':c.pr===2?' – wysoki':' – standardowy')],['Status realizacji',c.st],['Opis',c.info],['Zgłaszający',c.who]].concat(TK.filter(k=>c.tl&&c.tl[k]).map(k=>[TLN[k],c.tl[k]])));
const V={};
V.menu=()=>{const T=[['calls','ZLECENIA',()=>S.calls.length+' aktywnych'],['status','STATUS ZRM',()=>S.status],['pts','PACJENCI',()=>S.pts.length+' w systemie'],['docs','DOKUMENTACJA',()=>S.docs.length+' kart'],['map','MAPA',()=>'Lokalizacja zespołu'],['comm','ŁĄCZNOŚĆ',()=>S.msgs.length+' komunikatów'],['hist','HISTORIA WYJAZDÓW',()=>S.hist.length+' zleceń'],['set','USTAWIENIA',()=>'Terminal '+S.team]];

V.calls=()=>head('ZLECENIA')+'<div class="bd"><div class="bar"><button class="btn" data-act="go" data-v="callnew">+ Dodaj zlecenie</button></div>'+(S.calls.length?S.calls.map(c=>callRow(c,'call')).join(''):'<p class="em">Brak zleceń. Dodaj zlecenie przyciskiem powyżej.</p>')+'</div>';
V.callnew=()=>head('NOWE ZLECENIE')+'<div class="bd"><div class="fm">'+fld('Numer zdarzenia','id','text','','s2')+fld('Godzina zgłoszenia','t','time',hm(new Date()))+sel('Priorytet','pr',['P1','P2','P3'],'P2')+fld('Adres zdarzenia','addr','text','','s2')+fld('Rodzaj zdarzenia','type','text','','s2')+area('Opis zdarzenia','info','','s4')+fld('Zgłaszający (imię, telefon)','who','text','','s4')+'</div><div class="bar" style="margin-top:14px"><button class="btn" data-act="callsave">Zapisz</button><button class="btn sec" data-act="cancel">Anuluj</button></div></div>';

return head('MAPA')+'<div class="bd mp"><div class="bar" style="margin:0"><select id="msel" style="flex:1;margin:0">'+(all.length?all.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===MSEL?' selected':'')+'>'+esc(x.id)+' – '+esc(x.addr)+'</option>').join(''):'<option>Brak zleceń – dodaj zlecenie</option>')+'</select>'+M.map(m=>'<button class="btn '+(m[0]===MODE?'cur':'sec')+'" data-act="mode" data-a="'+m[0]+'">'+m[1]+'</button>').join('')+'</div><div class="mw"><svg id="msvg" viewBox="'+MV.x+' '+MV.y+' '+MV.w+' '+MV.h+'" preserveAspectRatio="xMidYMid meet">'+r+'</svg><div class="z"><button class="btn" data-act="mz" data-a="0.7">+</button><button class="btn" data-act="mz" data-a="1.4">−</button><button class="btn sec" data-act="mc">◎</button></div></div><div style="font-size:14px"><b style="color:#1565c0">● Z</b> Zespół '+esc(S.team)+' ('+esc(S.status)+') &nbsp; <b style="color:#c62828">● !</b> Zdarzenie'+(c?': '+esc(c.addr):'')+' &nbsp; <b style="color:#2e7d32">● H</b> Szpital &nbsp;|&nbsp; Wybierz znacznik i dotknij mapy, aby go ustawić.</div></div>'};
const bub=m=>'<div class="bub'+(m.me?' me':'')+'"><small>'+esc(m.from)+' • '+m.t+'</small>'+esc(m.txt)+'</div>';
V.comm=()=>head('ŁĄCZNOŚĆ – DYSPOZYTORNIA')+'<div class="bd cm"><div class="chat" id="chat">'+(S.msgs.length?S.msgs.map(bub).join(''):'<p class="em">Brak wiadomości. Wpisz pierwszy komunikat.</p>')+'</div><div class="snd"><select id="msd" style="width:230px;margin:0"><option>Od: ZRM</option><option>Od: Dyspozytornia</option></select><input id="mi" placeholder="Wpisz komunikat…" autocomplete="off"><button class="btn" data-act="send">Wyślij</button></div></div>';
V.hist=()=>head('HISTORIA WYJAZDÓW')+'<div class="bd">'+(S.hist.length?S.hist.map(c=>callRow(c,'histd')).join(''):'<p class="em">Brak zakończonych zleceń.</p>')+'</div>';
V.histd=id=>{const c=S.hist.find(x=>x.id===id);if(!c)return head('WYJAZD')+'<div class="bd"><p class="em">Nie znaleziono.</p></div>';return head('WYJAZD '+esc(c.id))+'<div class="bd two"><div class="card">'+callKv(c)+'</div><div class="btns"><button class="btn sec" data-act="gomap" data-a="'+esc(c.id)+'">Pokaż na mapie</button></div></div>'};
V.set=()=>head('USTAWIENIA')+'<div class="bd"><div class="fm">'+fld('Numer zespołu','team','text',S.team,'s2')+'<label class="f s2">Jasność ekranu: <span id="bv">'+S.set.bright+'</span>%<input name="bright" type="range" min="40" max="100" value="'+S.set.bright+'"></label><label class="f s2" style="margin-top:6px"><input name="sound" type="checkbox" style="display:inline;width:auto" '+(S.set.sound?'checked':'')+'> Dźwięki powiadomień</label></div><div class="bar" style="margin-top:16px"><button class="btn" data-act="setsave">Zapisz</button><button class="btn sec" data-act="cancel">Anuluj</button><button class="btn sec" data-act="lock">Zablokuj tablet</button><button class="btn red" data-act="reset" id="rs">Wyczyść wszystkie dane</button></div><div class="bar"><button class="btn sec" data-act="exp">Pobierz kopię danych (plik)</button><button class="btn sec" data-act="imp">Wczytaj kopię danych</button><input id="impf" type="file" accept=".json,application/json" hidden></div><p style="color:#5b6f86;font-size:13px">Dane zapisują się automatycznie w tej przeglądarce, na tym urządzeniu. Niezapisane formularze też są zapamiętywane.</p></div>';
const AFTER={map:mapInit,comm:()=>{const c=$('#chat');c.scrollTop=c.scrollHeight},status:tick};
function render(){const[v,a]=stack[stack.length-1];pg.innerHTML=V[v](a);pg.firstChild&&0;(AFTER[v]||(()=>{}))();const dr=(S.drafts||{})[v];if(dr)ui.querySelectorAll('[name]').forEach(e=>{if(dr[e.name]!=null)e.value=dr[e.name]});tick()}
function tick(){const d=new Date(),t=hm(d);ui.querySelectorAll('.clk').forEach(e=>e.textContent=t);ui.querySelectorAll('.dt').forEach(e=>{if(e.id!=='x')e.textContent=d.toLocaleDateString('pl-PL',{weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'})});
$('#ltm').textContent=t;$('#ldt').textContent=d.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const g=$('#ago');if(g)g.textContent=Math.floor((Date.now()-S.since)/60000)+' min temu'}
setInterval(tick,1000);
function mapInit(){const s=$('#msvg');if(!s)return;let d=null;
const up=()=>s.setAttribute('viewBox',MV.x+' '+MV.y+' '+MV.w+' '+MV.h);
s.addEventListener('pointerdown',e=>{d={sx:e.clientX,sy:e.clientY,x:e.clientX,y:e.clientY,m:false};s.setPointerCapture(e.pointerId)});
s.addEventListener('pointermove',e=>{if(!d)return;if(Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>6)d.m=true;if(!d.m)return;const r=s.getBoundingClientRect(),u=Math.max(MV.w/r.width,MV.h/r.height);MV.x-=(e.clientX-d.x)*u;MV.y-=(e.clientY-d.y)*u;d.x=e.clientX;d.y=e.clientY;up()});
s.addEventListener('pointerup',e=>{const was=d&&!d.m;d=null;if(was)place(s,e)});
s.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.8:1.25)},{passive:false})}
function place(s,e){const p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(s.getScreenCTM().inverse()),pt=[Math.round(q.x),Math.round(q.y)];
if(MODE==='t')S.tpos=pt;else if(MODE==='h')S.hosp=pt;else{const c=S.calls.concat(S.hist).find(x=>x.id===MSEL);if(!c)return toast('Najpierw dodaj zlecenie');c.x=pt[0];c.y=pt[1]}
save();render()}
function zoom(f){if(!MV)return;const cx=MV.x+MV.w/2,cy=MV.y+MV.h/2;MV.w=Math.min(MW,Math.max(250,MV.w*f));MV.h=MV.w*MH/MW;MV.x=cx-MV.w/2;MV.y=cy-MV.h/2;const s=$('#msvg');if(s)s.setAttribute('viewBox',MV.x+' '+MV.y+' '+MV.w+' '+MV.h)}
function step(id,i){const c=S.calls.find(x=>x.id===id);if(!c)return;const s=STEPS[i];c.st=s[1];(c.tl=c.tl||{})[TK[i]]=hm(new Date());if(s[2])setStatus(s[2]);
if(i===5){S.calls=S.calls.filter(x=>x!==c);S.hist.unshift(c);save();toast('Zlecenie zakończone');stack=[['menu'],['calls']];render();return}
save();toast(s[0]+' – zapisano');render()}
function addMsg(m){S.msgs.push(m);save();const c=$('#chat');if(c){const em=c.querySelector('.em');if(em)em.remove();c.insertAdjacentHTML('beforeend',bub(m));c.scrollTop=c.scrollHeight}}
function send(txt){txt=(txt||'').trim();if(!txt)return;const dp=$('#msd').value.indexOf('Dysp')>-1;addMsg({me:dp?0:1,from:dp?'Dyspozytornia':'ZRM '+S.team,t:hm(new Date()),txt});toast('Wiadomość zapisana')}
ui.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,x=b.dataset.a;
if(a==='go')nav(v,x);else if(a==='back')back();else if(a==='menu'){stack=[['menu']];render()}
else if(a==='step')step(b.dataset.id,+x);
else if(a==='setst'){setStatus(x);save();toast('Status: '+x);render()}
else if(a==='callsave'){const d=fd();if(!d.id.trim()||!d.addr.trim())return toast('Podaj numer zdarzenia i adres');if(S.calls.concat(S.hist).some(c=>c.id===d.id.trim()))return toast('Takie zlecenie już istnieje');delete (S.drafts||{}).callnew;S.calls.unshift({id:d.id.trim(),addr:d.addr.trim(),type:d.type.trim()||'—',t:d.t||hm(new Date()),pr:+d.pr.slice(1),st:'Oczekuje',info:d.info,who:d.who,tl:{}});save();toast('Zlecenie zapisane na tym urządzeniu');back()}
else if(a==='ptsave'){const d=fd();if(!d.name.trim())return toast('Podaj imię i nazwisko');d.id=Date.now();d.t=hm(new Date());delete (S.drafts||{}).ptnew;S.pts.unshift(d);save();toast('Pacjent zapisany na tym urządzeniu');back()}
else if(a==='docsave'){const d=fd();d.id=Date.now();d.t=hm(new Date());delete (S.drafts||{}).docnew;S.docs.unshift(d);save();toast('Dokumentacja zapisana na tym urządzeniu');back()}
else if(a==='send'){const i=$('#mi');send(i.value);i.value=''}
else if(a==='mode'){MODE=x;render()}
else if(a==='mz')zoom(+x)
else if(a==='mc'){MV=null;render()}
else if(a==='gomap'){MSEL=x;MV=null;nav('map')}
else if(a==='setsave'){const d=fd();S.team=(d.team||S.team).trim().toUpperCase();S.set.bright=+d.bright;S.set.sound=ui.querySelector('[name=sound]').checked;save();applyB();toast('Ustawienia zapisane');back()}
else if(a==='cancel'){const cv=stack[stack.length-1][0];if(S.drafts)delete S.drafts[cv];save();back()}
else if(a==='exp'){const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),l=document.createElement('a');l.href=u;l.download='swd-prm-kopia.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('Kopia pobrana')}
else if(a==='imp'){$('#impf').click()}
else if(a==='lock'){lockIt()}
else if(a==='reset'){if(b.dataset.c){S=seed();save();applyB();MV=null;MSEL=null;toast('Dane wyczyszczone');stack=[['menu']];render()}else{b.dataset.c=1;b.textContent='Kliknij ponownie, aby potwierdzić'}}});
ui.addEventListener('input',e=>{const cv=stack[stack.length-1][0];if(e.target.name&&['callnew','ptnew','docnew'].includes(cv)){(S.drafts=S.drafts||{});(S.drafts[cv]=S.drafts[cv]||{})[e.target.name]=e.target.value;save()}if(e.target.name==='bright'){S.set.bright=+e.target.value;applyB();$('#bv').textContent=e.target.value}});
ui.addEventListener('change',e=>{if(e.target.id==='impf'){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.calls))throw 0;S=o;save();applyB();MV=null;MSEL=null;toast('Kopia wczytana');stack=[['menu']];render()}catch(x){toast('To nie jest poprawny plik kopii')}};r.readAsText(f);return}if(e.target.id==='msel'){MSEL=e.target.value;MV=null;render()}});
ui.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='mi'){send(e.target.value);e.target.value=''}});
const L=$('#lock');let y0=null,dy=0;
function lockIt(){stack=[['menu']];render();L.style.transform='';L.classList.remove('drag')}
L.addEventListener('pointerdown',e=>{y0=e.clientY;dy=0;L.classList.add('drag');L.setPointerCapture(e.pointerId)});
L.addEventListener('pointermove',e=>{if(y0===null)return;dy=Math.min(0,(e.clientY-y0)/K);L.style.transform='translateY('+dy+'px)'});
function endSw(){if(y0===null)return;y0=null;L.classList.remove('drag');L.style.transform=dy<-120?'translateY(-110%)':''}
L.addEventListener('pointerup',endSw);L.addEventListener('pointercancel',endSw);
L.addEventListener('keydown',e=>{if(e.key==='ArrowUp'||e.key==='Enter')L.style.transform='translateY(-110%)'});
render();
</script>
</body>
</html>
